name: ${TAMASYA_STACK:?Set a unique property stack name}
x-api: &api
  image: ${TAMASYA_IMAGE:-tamasya-enterprise:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  env_file: ${TAMASYA_PRIVATE_DIR:?Set absolute private directory}/runtime.env
  volumes:
    - ${TAMASYA_PRIVATE_DIR}/db_credentials.php:/run/secrets/db_credentials.php:ro
    - uploads:/var/www/tamasya/uploads
    - state:/var/lib/tamasya
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  api: *api
  worker:
    <<: *api
    profiles: [workers]
    command: [php, service_worker.php, daemon]
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${TAMASYA_HTTP_PORT:-8080}:8080"]
    volumes:
      - ..:/var/www/tamasya:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/tamasya/uploads:ro
    depends_on: [api]
volumes:
  uploads: {}
  state: {}
